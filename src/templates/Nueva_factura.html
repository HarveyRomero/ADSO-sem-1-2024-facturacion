{% extends 'struc_pagina.html' %}

{% block contenido %}

<h1 style="color: rgb(21, 83, 47);">Nueva Factura</h1>
<form class="container mt-4" oninput="actualizarTotal()">
<div class="card mb-4">
    <div class="card-header bg-primary text-white">
      Datos del Cliente
    </div>
    <div class="card-body">
      <div class="row mb-3">
        <div class="col-md-3">
          <label class="form-label">Documento Cliente</label>
          <input type="number" class="form-control" placeholder="123456" min="0">
        </div>
        <div class="col-md-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" placeholder="ejemplo@correo.com">
        </div>
        <div class="col-md-3">
          <label class="form-label">No. Celular</label>
          <input type="number" class="form-control" placeholder="123456" min="0">
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <label for="fecha_factura" class="form-label">Fecha</label>
          <input type="date" class="form-control" id="fecha_factura" placeholder="dd/mm/yyyy">
        </div>
      </div>
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-header bg-success text-white">
      Detalle de Productos
    </div>
    <div class="card-body">

      <div id="productosContainer">
        <div class="row mb-3 producto-row align-items-end">
          <div class="col-md-3">
            <label class="form-label">ID Producto</label>
            <input type="number" class="form-control" min="1" step="1" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Cantidad</label>
            <input type="number" class="form-control cantidad" min="1" step="1" required oninput="calcularSubtotal(this)">
          </div>
          <div class="col-md-3">
            <label class="form-label">Precio unitario</label>
            <input type="number" class="form-control precio" min="0.01" step="0.01" required oninput="calcularSubtotal(this)">
          </div>
          <div class="col-md-2">
            <label class="form-label">Subtotal</label>
            <input type="text" class="form-control subtotal" readonly value="0.00">
          </div>
          <div class="col-md-1">
            <button type="button" class="btn btn-danger mt-4" onclick="eliminarFila(this)">Eliminar</button>
          </div>
        </div>
      </div>


<div class="mb-3">
  <button type="button" class="btn btn-success" onclick="agregarProducto()">Agregar otro producto</button>
</div>

<div class="row mb-4">
  <div class="col-md-4 offset-md-8">
    <label class="form-label"><strong>Total:</strong></label>
    <input type="text" class="form-control" id="totalGeneral" readonly value="0.00">
  </div>
</div>

<div class="row mb-3">
  <div class="col-md-4">
    <label for="paga" class="form-label">Paga</label>
    <input type="number" class="form-control" id="paga" placeholder="0.00" min="0" step="0.01" oninput="calcularCambio()">
  </div>
  <div class="col-md-4">
    <label for="cambio" class="form-label">Cambio</label>
    <input type="text" class="form-control" id="cambio" readonly value="0.00">
  </div>
</div>


  <div class="row mb-2">
    <div class="col-md-4">
      <label for="pago" class="form-label">Método de Pago</label>
      <select id="pago" class="form-select" required>
        <option selected disabled>Seleccione</option>
        <option>Tarjeta de crédito</option>
        <option>Tarjeta débito</option>
        <option>Efectivo</option>
        <option>Cheque</option>
        <option>Bono</option>
      </select>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-md-4 offset-md-4 d-grid gap-2">    

      <button type="submit" class="btn btn-primary" id="btnGenerarFactura" disabled>Generar factura</button>
      <button type="button" class="btn btn-success" onclick="guardarDatos()">Guardar</button>
      <button type="button" class="btn btn-warning" onclick="document.querySelector('form').reset();">Borrar</button>
      <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">Salir</button>
    </div>
  </div>

</form>

<!-- Con esto hago botoncito para duplicar celdas de productos -->
<script>
  function agregarProducto() {
    const container = document.getElementById('productosContainer');
    const nuevaFila = document.createElement('div');
    nuevaFila.className = 'row mb-3 producto-row align-items-end';
    nuevaFila.innerHTML = `
      <div class="col-md-3">
        <input type="number" class="form-control" placeholder="ID Producto" min="1" step="1" required>
      </div>
      <div class="col-md-3">
        <input type="number" class="form-control cantidad" placeholder="Cantidad" min="1" step="1" required oninput="calcularSubtotal(this)">
      </div>
      <div class="col-md-3">
        <input type="number" class="form-control precio" placeholder="Precio unitario" min="0.01" step="0.01" required oninput="calcularSubtotal(this)">
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control subtotal" readonly value="0.00">
      </div>
      <div class="col-md-1">
        <button type="button" class="btn btn-danger" onclick="eliminarFila(this)">Eliminar</button>
      </div>`;
    container.appendChild(nuevaFila);
    actualizarTotal();
  }
  
  function calcularSubtotal(elemento) {
    const fila = elemento.closest('.producto-row');
    const cantidad = parseFloat(fila.querySelector('.cantidad').value) || 0;
    const precio = parseFloat(fila.querySelector('.precio').value) || 0;
    const subtotal = cantidad * precio;
    fila.querySelector('.subtotal').value = subtotal.toFixed(2);
    actualizarTotal();
  }
  
  function eliminarFila(boton) {
    boton.closest('.producto-row').remove();
    actualizarTotal();
  }
  
  function actualizarTotal() {
  let total = 0;
  document.querySelectorAll('.subtotal').forEach(input => {
    total += parseFloat(input.value) || 0;
  });
  document.getElementById('totalGeneral').value = total.toFixed(2);
  calcularCambio(); // Actualiza el cambio si hay un valor en "Paga"
}

  function calcularCambio() {
  const total = parseFloat(document.getElementById('totalGeneral').value) || 0;
  const paga = parseFloat(document.getElementById('paga').value) || 0;
  const cambio = paga - total;

  document.getElementById('cambio').value = cambio >= 0 ? cambio.toFixed(2) : "0.00";
}

  </script>

{% endblock contenido %}
