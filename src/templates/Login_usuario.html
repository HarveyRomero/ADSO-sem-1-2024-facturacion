{% extends 'struc_pagina.html' %}
    
{% block contenido %}


<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 style="color: rgb(102, 96, 96);">LOGIN USUARIOS</h1>
  <img src="{{ url_for('static', filename='images/Logear usuario.PNG') }}" 
       alt="Login de usuarios" 
       style="height: 80px; width: auto;">
</div>

  <form>
    <div class="card mb-4">
      <div class="card-header bg-primary text-white">
        Datos del Cliente
      </div>
      <div class="card-body">
        <div class="mb-3">
          <label for="usuario" class="form-label"><strong>Usuario</strong></label>
          <input type="text" class="form-control" id="usuario" placeholder="Ingrese su usuario">
        </div>
  
        <div class="mb-3">
          <label for="clave" class="form-label"><strong>Password</strong></label>
          <input type="password" class="form-control" id="clave" placeholder="Ingrese su contraseña">
        </div>
  
        <div>
          <button type="submit" class="btn btn-warning btn-sm">Validar</button>
          <button type="button" class="btn btn-danger btn-sm" onclick="window.location.href='index.html'">Salir</button>
        </div>
      </div>
    </div>
  </form>

      <h1 style="font-style: italic; font-size: 1.5rem; text-align: center;">

        {% endblock contenido %}
